# SearXNG 配置 - 网络隔离版 (调研优化版)
#
# 改动 (vs 当前 4-engine 配置):
#   - 加 bing / brave:通用 web 搜索(美国 EDR 厂商主源)
#   - 加 chinaso (news):中国 EDR 厂商唯一本地源(英文引擎搜不到中文)
#   - 加 openalex:200M 论文索引(EDR 学术 + 厂商技术报告)
#   - 加 semantic_scholar:AI 驱动学术检索
#   - 加 duckduckgo / startpage / mojeek / qwant:R17 新增,通用 web 冗余
#   - 加 wikipedia:language: all 让中文命中
#   - 加 wikidata:厂商元数据(CEO/员工数/成立时间)
#   - 保留 arxiv:EDR bypass 论文强
#   - 关 pubmed:EDR 调研医学无关(R17)
#   - 删 github:缺 token 永远 access denied
#   - 删 openstreetmap:跟 EDR 完全无关
#
# 风险:
#   - bing/brave:共享 IP 偶尔 ban,SearXNG 内置 retry
#   - chinaso:官方文档警告 URL 隐私问题,只用于 news 类别(snippet only)
#   - openalex:推荐加 mailto 进 polite pool,本配置暂不加(需重启设 env)
#
# 数据准确性导向(notes/evidence-pipeline-runbook-v1.md):
#   - 优先 engines with primary source(arxiv/openalex/wikidata)
#   - 次选 metasearch engine(bing/brave/wikipedia)
#   - 谨慎 chinaso(只 news,snippet only)
---
server:
  bind_address: 0.0.0.0
  port: 8080
  secret_key: "${SEARXNG_SECRET}"
  limiter: false           # 关 rate limiter(本地单用户)
  image_proxy: false       # 关图片代理(避免被滥用为 open proxy)

botdetection:
  ip_limit:
    enabled: false
  link_token:
    enabled: false

outgoing:
  pool_connections: 100
  pool_maxsize: 20
  request_timeout: 30.0
  enable_http2: false
  retries: 3
  retry_on_http_error: true

engines:
  # ===== 通用 web 搜索(美国 EDR 厂商主源) =====
  # bing:无 API key,通用 web,有 IP ban 风险
  - name: bing
    engine: bing
    shortcut: bi
    categories: [general]
    disabled: false
    # bing 没 token,有时 IP ban;SearXNG 内置 retry

  # brave:无 API key,通用 web,中文质量低但能用
  - name: brave
    engine: brave
    shortcut: brave
    categories: [general]
    disabled: false
    brave_category: search
    # brave 标准版,无 token;Accept-Language 自动跟随 SearXNG locale

  # ===== 中国本地化(中国 EDR 厂商新闻唯一本地源) =====
  # chinaso:中国搜索,只 news 类别(URL 隐私问题官方警告)
  - name: chinaso news
    engine: chinaso
    shortcut: chinaso
    categories: [news]
    disabled: false
    chinaso_news_source: all
    # 官方默认 inactive: true(URL 隐私),显式启用
    # 只用 news 类别 — 不返回真实 URL,只有 snippet
    # EDR 调研:中国厂商(奇安信/深信服/亚信安全/360/安恒)的关键新闻源

  # ===== 学术检索(EDR bypass / 技术研究) =====
  - name: arxiv
    engine: arxiv
    shortcut: arx
    categories: [general, science]
    disabled: false
    # 学术论文库,EDR bypass / 检测算法对比论文多
    # 无 token;偶尔 arxiv 限流(临时抖动,会恢复)

  - name: openalex
    engine: openalex
    shortcut: oa
    categories: [science]
    disabled: false
    # 200M 论文索引,比 arxiv 覆盖更广
    # 2025 厂商技术报告 / 白皮书 / 学术综述均收录
    # 推荐加 mailto:进 polite pool,本配置暂不加
    timeout: 10.0

  - name: semantic scholar
    engine: semantic_scholar
    shortcut: se
    categories: [science]
    disabled: false
    # AI 驱动学术检索,200M 论文
    # EDR 安全研究 / 综述论文

  - name: pubmed
    engine: pubmed
    shortcut: pub
    categories: [science]
    disabled: true           # R17 ★:EDR/中国调研全无关(医学论文库),已关
    # 备用 — EDR 不直接相关,但生物医学文献搜索强
    # 39M+ 引用

  # ===== 通用 web 备选(R17 新增,提供 brave 限流下的冗余) =====
  # duckduckgo / startpage / mojeek / qwant — SearXNG 默认引擎列表的零依赖
  # 添加项,用于 brave IP-banned 时补充通用 web 召回。
  - name: duckduckgo
    engine: duckduckgo
    shortcut: ddg
    categories: [general]
    disabled: false
    # DDG HTML scrape(无 token);比 bing 中立,有时中文 EDR 召回更好
  - name: startpage
    engine: startpage
    shortcut: sp
    categories: [general]
    disabled: false
    # 通过 Google 结果代理,无 IP ban 风险;EDR 厂商市场报告补充源
  - name: mojeek
    engine: mojeek
    shortcut: moj
    categories: [general]
    disabled: false
    # 独立爬虫索引(不基于 bing/google),对中小网站覆盖更好
  - name: qwant
    engine: qwant
    shortcut: qw
    categories: [general]
    disabled: false
    # 欧盟隐私引擎,基于 Bing results + 自身索引

  # ===== 基础常识 / 厂商元数据 =====
  - name: wikipedia
    engine: wikipedia
    shortcut: wp
    categories: [general]
    disabled: false
    # 关键:语言匹配 SearXNG locale(默认 zh/en 都查)
    # EDR 等专有词条不在,但通用词条命中

  - name: wikidata
    engine: wikidata
    shortcut: wd
    categories: [general]
    disabled: false
    # 厂商元数据:成立时间/总部/CEO/员工数/子公司
    # 用 P31 (instance of) / P17 (country) 等关联查询
    # EDR 厂商基本信息结构化检索

doi_resolvers:
  oadoi.org: https://api.oadoi.org/
  doi.org: https://doi.org/

default_doi_resolver: oadoi.org

formats:
  # R18 ★:加回 html — 默认 SearXNG UI 走 / 不带 format 时也要能渲染页面
  # (audit L136 formats 段误判的根因:虽然 formats 是顶层 key 正常工作,
  # 但忘了加 html → 浏览器访问 / 返 csv 而非页面)。审计里也建议补 json/rss。
  - html
  - json
  - csv
  - rss