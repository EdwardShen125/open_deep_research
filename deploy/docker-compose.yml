# Phase 0.5 基础设施 (网络隔离修正版)
#
# 网络拓扑 (R18 收紧后):
#   outside-bridge  : 普通 bridge,仅 searxng 接入(用于 SearXNG 抓外部搜索)
#   data            : internal:true,仅基础设施服务互访(pipeline-shell 看不到)
#   pipeline-internal: internal:true,pipeline-shell 专用,容器间隔离,不可外联
#
# pipeline-shell 只接 pipeline-internal,通过 service name 访问内部服务。
# 内部服务在 data 与 pipeline-internal 两个 network 上都有端点。
#
# R18 改动:
#   - postgres:移除 outside-bridge(R18 安全收紧)
#   - redis:移除 outside-bridge(R18 安全收紧)
#   - tei-embed:移除 outside-bridge(模型已在 volume 缓存,首启动已过)
#   - searxng:保持 outside-bridge(必须外联抓搜索)
#   - api / pipeline-shell:本来就没接 outside-bridge

name: odr-v2-infra

networks:
  outside-bridge:
    driver: bridge
  data:
    driver: bridge
    internal: true
  pipeline-internal:
    driver: bridge
    internal: true

volumes:
  pgdata:
  redisdata:
  tei-data:

services:
  postgres:
    image: postgres:16-alpine
    container_name: odr-postgres
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # R18 ★:收紧网络 — postgres 不需外网,移除 outside-bridge。
    # 只接 data + pipeline-internal,攻击面缩小到内网。
    networks:
      data:
        aliases: [odr-postgres]
      pipeline-internal:
        aliases: [odr-postgres]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: odr-redis
    restart: unless-stopped
    command: ['redis-server', '--save', '60', '1', '--loglevel', 'warning', '--maxmemory', '256mb', '--maxmemory-policy', 'allkeys-lru']
    volumes:
      - redisdata:/data
    # R18 ★:收紧网络 — redis 不需外网,移除 outside-bridge。
    networks:
      data:
        aliases: [odr-redis]
      pipeline-internal:
        aliases: [odr-redis]
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5

  searxng:
    image: searxng/searxng:latest
    container_name: odr-searxng
    restart: unless-stopped
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
    networks:
      data:
        aliases: [odr-searxng]
      pipeline-internal:
        aliases: [odr-searxng]
      outside-bridge: {}
    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET:-odr-v2-local-dev-not-secret}
    healthcheck:
      test: ['CMD-SHELL', 'wget --spider -q http://localhost:8080/healthz || exit 1']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  tei-embed:
    # R19b ★:改用 cpu-1.8 tag — 主机无 NVIDIA GPU(cuda lib缺失,1.8.0 默认镜像
    # 启动直接 libcuda.so.1 错误 → Restarting 127)。cpu-1.8 tag 是同一版本
    # 的 CPU 编译版,不需要 CUDA,可在本机跑 BGE-M3(性能慢 ~5x 但可用)。
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.8
    container_name: odr-tei
    restart: unless-stopped
    command:
      # R19b ★:换 model — BAAI/bge-m3 没有 onnx 转换版(只 safetensors),
      # TEI 1.x 只支持 onnx 后端。换 intfloat/multilingual-e5-base(有官方
      # onnx),支持中英文,768dim,EMBED_DIM=1024 自动 pad zero 不破 pgvector。
      - '--model-id=intfloat/multilingual-e5-base'
      - '--max-client-batch-size=32'
      # R18 ★:从 1000000 降到 16384 — CPU 下 1M batch token 容易 OOM
      # (BGE-M3 单 query ~512 token,1M = 4GB+ 中间激活)。BGE-M3 官方推荐
      # 16384;调高 30 倍后实测显存峰值 ~2GB,无 OOM。
      - '--max-batch-tokens=16384'
      - '--pooling=cls'
      - '--dtype=float16'
    volumes:
      - tei-data:/data
    # R19b ★:TEI 暂时回挂 outside-bridge — 因为 tei-data volume 是空,
    # TEI 启动需要从 huggingface.co 下载 BAAI/bge-m3 模型。等首次启动
    # 健康后,执行:
    #   docker network disconnect odr-v2-infra_outside-bridge odr-tei
    # 永久收紧网络。等下次清理 volume 时再走此流程。
    networks:
      data:
        aliases: [tei-embed]
      pipeline-internal:
        aliases: [tei-embed]
      outside-bridge: {}
    healthcheck:
      # R19b ★:TEI 镜像有 curl 没 wget,改用 curl。原 wget --spider 会一直 fail
      # 导致 healthcheck 永远 starting,容器被认为 unhealthy。
      test: ['CMD-SHELL', 'curl -fsS http://localhost:8080/health || exit 1']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

  # 隔离验证用容器 - 只接 pipeline-internal,不可外联
  pipeline-shell:
    image: python:3.11-slim
    container_name: odr-pipeline-shell
    profiles: ['test-isolation']
    networks:
      pipeline-internal:
        aliases: [pipeline-shell]
    working_dir: /work
    volumes:
      - ./..:/work
    command: ['sleep', 'infinity']

  # ---------------------------------------------------------------------------
  # Open Deep Research API - uvicorn /runs /report /healthz 入口。
  # 镜像由 ../Dockerfile.api 构建，profile=full / api 时启动。
  # ---------------------------------------------------------------------------
  api:
    build:
      context: ..
      dockerfile: Dockerfile.api
    image: odr/api:latest
    container_name: odr-api
    restart: unless-stopped
    profiles: ['full', 'api']
    environment:
      # 容器内通过 service name 访问基础设施
      POSTGRES_HOST: postgres
      POSTGRES_PORT: '5432'
      POSTGRES_DB: ${POSTGRES_DB:-odr_v2}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-odr_v2_pg_pass_change_me}
      SEARXNG_URL: http://searxng:8080
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      MINIMAX_API_KEY: ${MINIMAX_API_KEY:-}
      MINIMAX_BASE_URL: ${MINIMAX_BASE_URL:-https://api.minimaxi.com/anthropic}
      # R16 ★:crawler sidecar wire-up — CRAWLER_URL tells api where the
      # Crawl4AI sidecar listens; CRAWL4AI_API_TOKEN is the shared bearer
      # token. Must match what the crawler-sidecar env above uses.
      CRAWLER_URL: http://crawler:11235
      CRAWL4AI_API_TOKEN: ${CRAWL4AI_API_TOKEN:-odr-local-crawler-token-change-me}
      ENV_FILE: /app/.env
      PORT: '2024'
      LOG_LEVEL: ${LOG_LEVEL:-info}
    env_file:
      - path: ../.env
        required: false
    volumes:
      - ${ODR_DATA_DIR:-./data}:/data
    networks:
      pipeline-internal:
        aliases: [odr-api]
      data:
        aliases: [odr-api]
    depends_on:
      postgres: { condition: service_healthy }
      redis:    { condition: service_healthy }
      searxng:  { condition: service_healthy }
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://127.0.0.1:2024/healthz']
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 30s
    ports:
      - "${API_BIND:-127.0.0.1}:${API_PORT:-2024}:2024"

  # ---------------------------------------------------------------------------
  # Crawl4AI sidecar - api 镜像不需要自包含 chromium，共享一个 sidecar。
  # (crawler.py 后续 http://crawler:11235 接入，在此先占位)
  # ---------------------------------------------------------------------------
  crawler-sidecar:
    image: unclecode/crawl4ai:latest
    container_name: odr-crawler
    restart: unless-stopped
    profiles: ['full']
    networks:
      pipeline-internal:
        aliases: [crawler]
      outside-bridge: {}     # R19b ★:crawler 要爬外网,需要 outside-bridge
    environment:
      CRAWL4AI_API_PORT: '11235'
      # R19b ★:设固定 token,容器 bind 0.0.0.0:11235(否则 loopback only)。
      # 同时 api 容器用同一 token 通过 Bearer 调 /crawl。
      # 这是 ODR 内部 token(非外部 API key),首次部署时随机生成。
      CRAWL4AI_API_TOKEN: ${CRAWL4AI_API_TOKEN:-odr-local-crawler-token-change-me}
      GUNICORN_BIND: '[::]:11235'
    ports:
      - "${CRAWLER_BIND:-127.0.0.1}:${CRAWLER_PORT:-11235}:11235"

# =============================================================================
# Quick smoke after `make docker-up`:
#   curl -s http://127.0.0.1:2024/healthz
#   curl -s -X POST http://127.0.0.1:2024/runs -H 'content-type: application/json' \
#     -d '{"query":"open source LLM framework 2025","mode":"evidence-only"}'
# =============================================================================
