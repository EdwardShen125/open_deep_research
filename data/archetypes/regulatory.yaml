# archetype: regulatory
# Reusable across domains. Owns the question shape "what rules apply".
# Per-regulation expansion is driven by ontology.regulations.

archetype_id: regulatory
title: 合规准入
description: |
  {market} 区域 {category} 适用的法规清单 + 适用性 + 合规成本。
  法规实体来自 ontology.regulations,跨领域复用(如 GDPR 适用于 SaaS / F&B / 任何处理 EU 客户数据)。

sections:
  - id: applicable_regulations
    title: 适用法规
    # 动态展开 — 不手写法规名,从 ontology.regulations 取
    expansion:
      source: "{ontology}.regulations"
      cap: 20
      per_item_slot:
        id: "reg_{item_id}"
        question: "{item[name]} 对 {market} {category} 厂商的适用性与要求"
        expected_claim_type: qualitative
        notes: "{item_id} 在 expansion 中暴露,供 query_constructor 引用具体法规名"

  - id: compliance_requirements
    title: 合规要求
    slots:
      - id: certifications_required
        question: "{market} {category} 厂商必备的认证 / 资质"
        expected_claim_type: attribute
        notes: 等保 / ISO 27001 / SOC 2 / 等
      - id: audit_frequency
        question: "{market} {category} 厂商合规审计频次与主体"
        expected_claim_type: qualitative
      - id: data_residency
        question: "{market} {category} 厂商数据本地化要求"
        expected_claim_type: qualitative

  - id: penalties
    title: 违规处罚
    slots:
      - id: fine_structure
        question: "{market} {category} 厂商违规处罚金额上限"
        expected_claim_type: quantitative
        required_tier_min: A
        caliber_ref: "{ontology}.fine_amount"
      - id: enforcement_history
        question: "{market} {category} 近 {year_minus_2} 年典型执法案例"
        expected_claim_type: event

  - id: cross_border
    title: 跨境合规
    slots:
      - id: cross_border_license
        question: "{market} 厂商进入对方市场的牌照 / 备案要求"
        expected_claim_type: qualitative
        notes: 出口管制 / 双重用途物项 / 数据出境
      - id: cross_border_data
        question: "{market} 数据跨境传输的合规要求"
        expected_claim_type: qualitative
        notes: GDPR / 数据安全法 / 标准合同
